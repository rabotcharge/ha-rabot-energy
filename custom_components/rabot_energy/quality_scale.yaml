# Progress against the Home Assistant Integration Quality Scale.
# Statuses are honest as of the first scaffold; update them with every change.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no custom actions yet.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: done
  dependency-transparency: todo
  docs-actions:
    status: exempt
    comment: No custom actions yet.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events; they refresh from the coordinator and a time listener.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No custom actions yet.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: todo
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: Cloud service, nothing to discover.
  discovery:
    status: exempt
    comment: Cloud service, nothing to discover.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One device per contract, fixed at setup.
  entity-category: todo
  entity-device-class:
    status: exempt
    comment: Per-kWh prices have no suitable device class (monetary does not allow measurement).
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: One device per contract, fixed at setup.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
